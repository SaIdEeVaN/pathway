# SecretSentinel policy for this fork (read by the central scan in SaIdEeVaN/secretsentinel).
# Reviewed exceptions only. Each one names a rule and an exact path, says why it is
# safe, and expires so it is looked at again. Anything not listed still blocks.
version: 1
suppressions:
  - id: PW-001
    rule_id: aws-access-token
    path: integration_tests/s3/test_s3_interops.py
    reason: >-
      Upstream Pathway test file, deleted since (git history only). It hard-codes AWS
      access key IDs only; every secret access key is read from os.environ. A key ID
      alone grants no access, and the AWS account belongs to the upstream project.
    reviewer: Claude Code for SaIdEeVaN (2026-11-12)
    expires: 2027-05-12

  - id: PW-002
    rule_id: generic-api-key
    path: integration_tests/s3/test_s3_interops.py
    reason: >-
      Same upstream test file: a MinIO access key ID; the matching secret is read from
      os.environ. Was already non-blocking; recorded as reviewed.
    reviewer: Claude Code for SaIdEeVaN (2026-11-12)
    expires: 2027-05-12

  - id: PW-003
    rule_id: mapbox-api-token
    path: examples/projects/twitter/docker-compose/settings.env
    reason: >-
      Upstream example's Mapbox public token (pk.), which the example ships to the
      browser by design (webpack EnvironmentPlugin). Owned by the upstream project;
      it cannot be rotated from this fork.
    reviewer: Claude Code for SaIdEeVaN (2026-11-12)
    expires: 2027-05-12
